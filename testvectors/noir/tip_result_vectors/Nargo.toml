[package]
name = "tip_result_vectors"
type = "bin"
# exact: nargo 1.0.0 (toolchain.json); nargo reads no prerelease, so the contract
# compiler 1.0.0-rc.3 this program builds with passes too
compiler_version = "=1.0.0"

[dependencies]
# The tip contract library whose own functions the vectors are checked with,
# and aztec-nr for AztecAddress and compute_log_tag; both build with the
# contract compiler (CONTRACT_NARGO_BIN, nargo 1.0.0-rc.3).
pss_public_contract = { path = "../../../noir/pss_public_contract" }
aztec = { path = "../../../deps/aztec-world/noir-projects/aztec-nr/aztec" }
