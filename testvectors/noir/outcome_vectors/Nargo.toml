[package]
name = "outcome_vectors"
type = "bin"
# exact: the round circuits' Noir 1.0.0 (toolchain.json noir.version)
compiler_version = "=1.0.0"

[dependencies]
# The round circuits' own outcome functions, built with the circuit compiler
# (NARGO_BIN, nargo 1.0.0).
pss_core = { path = "../../../noir/pss_core" }
# total-noir's fixed-length Poseidon2 (Aztec's poseidon2_hash), for the
# client's per-request derivations (testvectors/secret_store.json)
total = { git = "https://github.com/iAmMichaelConnor/total-noir", tag = "v0.1.0", directory = "noir/total" }
