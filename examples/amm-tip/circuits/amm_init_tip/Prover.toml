# The fixture scenario: namespace 0xc0ffee, pool slot
# 0xa002, nsk_app 777 and seed 111 are examples/amm's fixture values, so
# the pool is Pool::from_seed(111) = [1359373, 1852331], the pool every
# fixture of examples/amm-swap-total trades on; its blinding 333 is the
# swaps' r_old, so this round's new_c is the old_c of every
# amm_swap_tip fixture on the live pool. The values are arbitrary test
# data with no meaning beyond that chain.
namespace = "0xc0ffee"
# a stand-in for the circuit's vk hash, which init_pool checks
vk_hash = "0x5a5a"
out_slots = ["0xa002"]
rand_seed = "111"
r_new = "333"
nsk_app = "777"
