[package]
name = "gigadoram-data-structures"
description = "GigaDoram building blocks: the speed cache, the oblivious hash table, the cuckoo table (vendored from TaceoLabs/gigadoram-rs; see PROVENANCE.md)"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "data_structures"

[dependencies]
circuits = { path = "../circuits", package = "gigadoram-circuits" }
eyre.workspace = true
mpc_core.workspace = true
mpc_net.workspace = true
primitives = { path = "../primitives", package = "gigadoram-primitives" }

[dev-dependencies]
primitives = { path = "../primitives", package = "gigadoram-primitives", features = ["testing"] }
rand.workspace = true
