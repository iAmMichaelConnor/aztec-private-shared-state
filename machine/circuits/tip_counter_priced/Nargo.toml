[package]
name = "tip_counter_priced"
type = "bin"
# exact: the round circuits' Noir 1.0.0 (toolchain.json noir.version)
compiler_version = "=1.0.0"

[dependencies]
# the tip round helpers: the request id, the slot commitment and
# the store of the vector
pss_core = { path = "../../../noir/pss_core" }
# total-noir's Outcome, which a round hands to the slot helpers
total = { git = "https://github.com/iAmMichaelConnor/total-noir", tag = "v0.1.0", directory = "noir/total" }
